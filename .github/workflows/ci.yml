name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    # Manual trigger - run from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build hello-world sample
        working-directory: samples/hello-world-custom-handler/src
        run: |
          go build -v -o handler .

      - name: Build qr-generator sample
        working-directory: samples/qr-generator-custom-handler
        run: |
          go build -v -o handler .

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Lint hello-world sample
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: samples/hello-world-custom-handler/src
          args: --timeout=5m

      - name: Lint qr-generator sample
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: samples/qr-generator-custom-handler
          args: --timeout=5m

  vet:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet hello-world sample
        working-directory: samples/hello-world-custom-handler/src
        run: go vet ./...

      - name: Vet qr-generator sample
        working-directory: samples/qr-generator-custom-handler
        run: go vet ./...
